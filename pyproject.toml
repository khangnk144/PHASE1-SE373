[project]
name = "ielts-learning-agent"
version = "0.1.0"
description = "SE373 group 38 — Phase 1 text Speaking mock test"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx[socks]>=0.28,<0.29",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.45,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
"scripts/smoke_live.py" = ["E402"]
